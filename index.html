<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoxSave - Modern Savings Tracker</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFD600">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2489/2489756.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #F0F2F5;
            --main: #FFD600; /* Yellow Neubrutalism */
            --secondary: #4D96FF; /* Blue */
            --accent: #FF6B6B; /* Red/Coral */
            --success: #6BCB77; /* Green */
            --bw-900: #121212;
            --bw-100: #FFFFFF;
            --shadow: 4px 4px 0px #121212;
            --shadow-sm: 2px 2px 0px #121212;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lexend', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--bw-900);
            padding: 20px 16px 40px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- ANIMATIONS --- */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* --- UI COMPONENTS --- */
        .card {
            background: var(--bw-100);
            border: 3px solid var(--bw-900);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 24px;
            position: relative;
        }

        h1, h2, h3 { font-weight: 800; text-transform: uppercase; letter-spacing: -0.5px; }
        
        .label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #555; margin-bottom: 4px; display: block; }

        /* --- HEADER & STATS --- */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header-brand { display: flex; align-items: center; gap: 12px; }
        .header svg { width: 32px; height: 32px; }

        /* Real-time Calendar Component */
        .mini-calendar {
            background: var(--bw-100);
            border: 3px solid var(--bw-900);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            text-align: center;
            min-width: 65px;
            overflow: hidden;
        }
        .cal-month { background: var(--accent); color: white; font-size: 0.6rem; font-weight: 800; padding: 2px; text-transform: uppercase; border-bottom: 2px solid var(--bw-900); }
        .cal-day { font-size: 1.2rem; font-weight: 800; padding: 4px 0; }

        .total-box { background: var(--main); text-align: center; }
        .total-amount { font-size: 2.2rem; margin: 8px 0; font-weight: 800; transition: all 0.3s ease; }
        .bump { transform: scale(1.1); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        .stat-item { border: 2px solid var(--bw-900); padding: 10px; border-radius: 8px; font-size: 0.9rem; background: rgba(255,255,255,0.5); }
        .stat-val { font-weight: 800; display: block; }

        /* --- PROGRESS BAR --- */
        .progress-container { margin: 20px 0; }
        .progress-wrapper {
            height: 28px;
            background: #eee;
            border: 3px solid var(--bw-900);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-right: 3px solid var(--bw-900);
        }
        .progress-info { display: flex; justify-content: space-between; margin-top: 8px; font-weight: 800; font-size: 0.85rem; }

        /* --- ESTIMATION BOX --- */
        .estimation-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #eef2ff;
            border: 2px solid var(--bw-900);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 24px;
        }
        .est-icon { background: var(--secondary); padding: 8px; border-radius: 8px; border: 2px solid var(--bw-900); color: white; }
        .est-text { font-size: 0.8rem; font-weight: 600; line-height: 1.3; }

        /* --- FORMS --- */
        .form-group { margin-bottom: 16px; }
        input {
            width: 100%;
            padding: 14px;
            border: 3px solid var(--bw-900);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.05);
        }
        input:focus { border-color: var(--secondary); background: #f0f7ff; }

        .btn {
            width: 100%;
            padding: 16px;
            border: 3px solid var(--bw-900);
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.1s;
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .btn-main { background: var(--secondary); color: white; }
        .btn-outline { background: var(--bw-100); }

        /* --- TABLE & DROPDOWN --- */
        .history-container { margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; background: #f8f8f8; padding: 12px; border-bottom: 3px solid var(--bw-900); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 0.85rem; position: relative; }
        
        .action-menu { position: relative; display: inline-block; }
        .dots-btn {
            background: none;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dots-btn:hover { border-color: var(--bw-900); background: #eee; }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: var(--bw-100);
            min-width: 100px;
            border: 3px solid var(--bw-900);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            z-index: 10;
        }
        .dropdown-content.show { display: block; animation: popIn 0.2s ease; }
        .dropdown-content button {
            width: 100%;
            padding: 10px;
            border: none;
            background: none;
            text-align: left;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .dropdown-content button:hover { background-color: #f0f0f0; }
        .dropdown-content button.del-opt { color: var(--accent); border-top: 1px solid #eee; }

        /* --- MOTIVATION --- */
        .motivation-box {
            background: var(--accent);
            color: white;
            font-style: italic;
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.4;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        /* --- TOAST --- */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bw-900);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            display: none;
            z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border: 2px solid var(--bw-900);
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            margin-bottom: 8px;
            box-shadow: 2px 2px 0px var(--bw-900);
        }

        .empty-state { text-align: center; padding: 20px; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path></svg>
            <h1>TELUR GULUNG</h1>
        </div>
        <div class="mini-calendar" id="mini-calendar">
            <div class="cal-month" id="cal-month">---</div>
            <div class="cal-day" id="cal-day">--</div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="card total-box animate-pop">
        <span class="label">Total Tabungan</span>
        <div class="total-amount" id="display-total">Rp 0</div>
        <div id="status-container"></div>
        
        <div class="progress-container">
            <div class="progress-wrapper">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
            <div class="progress-info">
                <span id="display-percent">0%</span>
                <span id="display-target-label">Target: Rp 0</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="label">Target</span>
                <span class="stat-val" id="stat-target">Rp 0</span>
            </div>
            <div class="stat-item">
                <span class="label">Sisa</span>
                <span class="stat-val" id="stat-remaining">Rp 0</span>
            </div>
        </div>
    </div>

    <!-- Countdown Estimation -->
    <div class="estimation-box animate-pop">
        <div class="est-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <div class="est-text" id="est-text">
            Menganalisis rata-rata tabunganmu...
        </div>
    </div>

    <!-- Input Tabungan -->
    <div class="card">
        <h3><svg style="width:18px;vertical-align:middle;margin-right:8px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Tambah Tabungan</h3>
        <div class="form-group" style="margin-top:15px">
            <input type="number" id="input-amount" placeholder="Nominal (Contoh: 50000)">
        </div>
        <button class="btn btn-main" id="save-btn" onclick="saveSaving()">Simpan Tabungan</button>
    </div>

    <!-- Motivation Card -->
    <div class="card motivation-box" id="motivation-display">
        "Memuat motivasi hari ini..."
    </div>

    <!-- Update Target -->
    <div class="card">
        <h3><svg style="width:18px;vertical-align:middle;margin-right:8px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>Atur Target</h3>
        <div class="form-group" style="margin-top:15px">
            <input type="number" id="input-target" placeholder="Target Baru (Contoh: 1000000)">
        </div>
        <button class="btn btn-outline" onclick="updateTarget()">Update Target</button>
    </div>

    <!-- History -->
    <div class="card">
        <h3><svg style="width:18px;vertical-align:middle;margin-right:8px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>Riwayat</h3>
        <div class="history-container">
            <table id="savings-table">
                <thead>
                    <tr>
                        <th>Nominal</th>
                        <th>Waktu</th>
                        <th style="width:50px"></th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <!-- Data injected here -->
                </tbody>
            </table>
            <div id="empty-state" class="empty-state">Belum ada catatan tabungan.</div>
        </div>
    </div>

    <div id="toast">Berhasil diperbarui!</div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBq12eDYuPekEkFv7mp18MiGCZ7MaxCXlA",
            authDomain: "tabungan-aing.firebaseapp.com",
            projectId: "tabungan-aing",
            storageBucket: "tabungan-aing.firebasestorage.app",
            messagingSenderId: "1092885548645",
            appId: "1:1092885548645:web:34dd3e2e2b835f20cec08c",
            measurementId: "G-E9Z8W74TZD",
            databaseURL: "https://tabungan-aing-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- DATA MOTIVASI ---
        const motivations = [
            "Uang kecil hari ini adalah kebebasan besar nanti.",
            "Konsistensi lebih penting dari nominal besar.",
            "Sedikit demi sedikit lama-lama menjadi bukit.",
            "Hari ini menabung, masa depan tenang.",
            "Disiplin keuangan adalah bentuk cinta pada diri sendiri.",
            "Tabunganmu adalah jaring pengaman masa depanmu.",
            "Setiap rupiah yang disimpan adalah tentara untuk masa depan.",
            "Kebebasan finansial dimulai dari satu langkah kecil.",
            "Hemat bukan berarti pelit, tapi bijaksana.",
            "Menabung itu sulit di awal, tapi manis di akhir.",
            "Kendalikan uangmu atau uang akan mengendalikanmu.",
            "Masa tua yang nyaman dibeli dengan disiplin masa muda.",
            "Jangan tunggu sisa, sisihkan di awal.",
            "Kunci kekayaan adalah manajemen, bukan sekadar gaji.",
            "Buktikan bahwa kamu bisa mencapai target ini!"
        ];

        let currentTarget = 0;
        let allSavings = [];
        let editId = null;

        const formatIDR = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        const showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        };

        const triggerConfetti = () => {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#FFD600', '#4D96FF', '#FF6B6B', '#6BCB77'] });
        };

        const updateMotivation = () => {
            const rand = Math.floor(Math.random() * motivations.length);
            document.getElementById('motivation-display').innerText = `"${motivations[rand]}"`;
        };

        const updateCalendar = () => {
            const now = new Date();
            const months = ["JAN", "FEB", "MAR", "APR", "MEI", "JUN", "JUL", "AGT", "SEP", "OKT", "NOV", "DES"];
            document.getElementById('cal-month').innerText = months[now.getMonth()];
            document.getElementById('cal-day').innerText = now.getDate();
        };

        // --- DATABASE LOGIC ---
        onValue(ref(db, 'target'), (snapshot) => {
            currentTarget = snapshot.val()?.targetAmount || 0;
            updateUI();
        });

        onValue(ref(db, 'savings'), (snapshot) => {
            const data = snapshot.val();
            allSavings = [];
            if (data) {
                for (let id in data) allSavings.push({ id, ...data[id] });
            }
            allSavings.sort((a, b) => b.timestamp - a.timestamp);
            updateUI();
        });

        window.saveSaving = async () => {
            const amountInput = document.getElementById('input-amount');
            const amount = parseInt(amountInput.value);
            if (!amount || amount <= 0) return alert("Masukkan nominal yang valid!");

            if (editId) {
                await update(ref(db, `savings/${editId}`), { amount: amount });
                editId = null;
                document.getElementById('save-btn').innerText = "Simpan Tabungan";
                showToast("Data berhasil diupdate!");
            } else {
                const now = new Date();
                const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
                const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
                
                const newEntry = {
                    amount: amount,
                    day: days[now.getDay()],
                    date: now.getDate(),
                    month: months[now.getMonth()],
                    year: now.getFullYear(),
                    time: now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                    timestamp: Date.now()
                };

                await push(ref(db, 'savings'), newEntry);
                triggerConfetti();
                const totalDisp = document.getElementById('display-total');
                totalDisp.classList.add('bump');
                setTimeout(() => totalDisp.classList.remove('bump'), 300);
                showToast("Tabungan disimpan! Mantap!");
            }

            amountInput.value = "";
            updateMotivation();
        };

        window.updateTarget = async () => {
            const val = parseInt(document.getElementById('input-target').value);
            if (!val || val <= 0) return alert("Masukkan target yang valid!");
            await set(ref(db, 'target'), { targetAmount: val, updatedAt: Date.now() });
            document.getElementById('input-target').value = "";
            showToast("Target diperbarui!");
        };

        window.deleteSaving = async (id) => {
            if (confirm("Hapus catatan tabungan ini?")) {
                await remove(ref(db, `savings/${id}`));
                showToast("Data dihapus!");
            }
        };

        window.editSaving = (id, amount) => {
            editId = id;
            document.getElementById('input-amount').value = amount;
            document.getElementById('save-btn').innerText = "Update Data";
            document.getElementById('input-amount').focus();
            window.scrollTo({ top: 400, behavior: 'smooth' });
        };

        window.toggleMenu = (id) => {
            document.querySelectorAll('.dropdown-content').forEach(el => {
                if(el.id !== `menu-${id}`) el.classList.remove('show');
            });
            document.getElementById(`menu-${id}`).classList.toggle('show');
        };

        window.onclick = (event) => {
            if (!event.target.matches('.dots-btn') && !event.target.closest('.dots-btn')) {
                document.querySelectorAll('.dropdown-content').forEach(el => el.classList.remove('show'));
            }
        };

        function calculateEstimation(total, remaining) {
            const estText = document.getElementById('est-text');
            const now = new Date();
            
            // Hitung tanggal 1 di bulan berikutnya
            const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            const diffTime = nextMonth - now;
            const daysToPayday = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (remaining <= 0) {
                estText.innerHTML = "<b>Target Tercapai!</b> Nikmati hasil kerja kerasmu. 🏆";
                return;
            }

            if (allSavings.length < 2) {
                estText.innerHTML = `Nabung <b>${daysToPayday} hari</b> lagi gajian/bulan baru! Semangat terus ya.`;
                return;
            }

            // Hitung rata-rata per hari (berdasarkan rentang waktu input)
            const firstDate = allSavings[allSavings.length - 1].timestamp;
            const lastDate = allSavings[0].timestamp;
            const daysDiff = Math.max(1, (lastDate - firstDate) / (1000 * 60 * 60 * 24));
            const avgPerDay = total / daysDiff;
            
            if (avgPerDay === 0) {
                estText.innerHTML = `Gajian tiba dalam <b>${daysToPayday} hari!</b> Yuk mulai nabung lagi.`;
                return;
            }

            const daysLeft = Math.ceil(remaining / avgPerDay);
            estText.innerHTML = `Estimasi penuh <b>${daysLeft} hari</b> lagi. Gajian tiba dalam <b>${daysToPayday} hari!</b>`;
        }

        function updateUI() {
            const total = allSavings.reduce((acc, curr) => acc + curr.amount, 0);
            const remaining = Math.max(0, currentTarget - total);
            const percent = currentTarget > 0 ? Math.min(100, (total / currentTarget) * 100) : 0;

            document.getElementById('display-total').innerText = formatIDR(total);
            document.getElementById('display-target-label').innerText = `Target: ${formatIDR(currentTarget)}`;
            document.getElementById('stat-target').innerText = formatIDR(currentTarget);
            document.getElementById('stat-remaining').innerText = formatIDR(remaining);
            document.getElementById('display-percent').innerText = `${percent.toFixed(1)}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            calculateEstimation(total, remaining);

            const statusContainer = document.getElementById('status-container');
            if (total >= currentTarget && currentTarget > 0) {
                statusContainer.innerHTML = '<span class="status-badge" style="background:var(--success)">TARGET TERCAPAI! 🏆</span>';
                if(!window.onceConfetti) { triggerConfetti(); window.onceConfetti = true; }
            } else {
                statusContainer.innerHTML = percent > 70 ? '<span class="status-badge" style="background:var(--main)">HAMPIR TERCAPAI! 🔥</span>' : '<span class="status-badge" style="background:#eee">ON PROGRESS 🏃‍♂️</span>';
                window.onceConfetti = false;
            }

            const tbody = document.getElementById('history-body');
            const emptyState = document.getElementById('empty-state');
            tbody.innerHTML = "";

            if (allSavings.length === 0) {
                emptyState.style.display = "block";
            } else {
                emptyState.style.display = "none";
                allSavings.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.classList.add('animate-pop');
                    tr.innerHTML = `
                        <td style="font-weight:800; color: #2E7D32">${formatIDR(item.amount)}</td>
                        <td>
                            <div style="font-size:0.7rem; color: #666; font-weight:600">${item.day}, ${item.date} ${item.month}</div>
                            <div style="font-weight:400">${item.time}</div>
                        </td>
                        <td>
                            <div class="action-menu">
                                <button class="dots-btn" onclick="toggleMenu('${item.id}')">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                                </button>
                                <div class="dropdown-content" id="menu-${item.id}">
                                    <button onclick="editSaving('${item.id}', ${item.amount})" style="display:flex; align-items:center; gap:8px;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                        Edit
                                    </button>
                                    <button class="del-opt" onclick="deleteSaving('${item.id}')" style="display:flex; align-items:center; gap:8px;">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                        Hapus
                                    </button>
                                </div>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            update(ref(db, 'summary'), { totalSavings: total, remaining: remaining, progressPercent: percent });
        }

        updateMotivation();
        updateCalendar();

        // Register Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA Ready!', reg.scope))
                    .catch(err => console.log('PWA Failed!', err));
            });
        }
    </script>
</body>
</html>
